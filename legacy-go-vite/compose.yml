services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mood
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mood -d mood"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    profiles: [container]
    build: .
    environment:
      DATABASE_URL: postgres://mood:${POSTGRES_PASSWORD}@db:5432/mood?sslmode=disable
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DATA: ${SEED_DATA:-true}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - upload_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  upload_data:
  postgres_data:
